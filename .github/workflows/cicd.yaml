name: CI/CD + CDK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

  ECR_REPOSITORY: greythr-api

  ECS_CLUSTER: greythr-cluster
  ECS_SERVICE: greythr-service


jobs:

  # ==================================================
  # Detect Infrastructure Changes
  # ==================================================
  changes:
    name: Detect Changes

    runs-on: ubuntu-latest

    outputs:
      cdk: ${{ steps.filter.outputs.cdk }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------
      # Check whether CDK files changed
      # ------------------------------------------------
      - name: Detect Infrastructure Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cdk:
              - 'infra/**'
              - '.github/workflows/cicd.yaml'


  # ==================================================
  # Formatting
  # ==================================================
  format-check:
    name: Formatting

    needs:
      - changes

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------
      # Checkout
      # ------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------
      # Black
      # ------------------------------------------------
      - name: Run Black Check
        uses: psf/black@stable
        with:
          version: "25.1.0"
          options: "--check"


  # ==================================================
  # Tests
  # ==================================================
  test:
    name: Tests

    needs:
      - format-check

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------
      # Checkout
      # ------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------
      # Install UV
      # ------------------------------------------------
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true


      # ------------------------------------------------
      # Python
      # ------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ------------------------------------------------
      # Install Application Dependencies
      # ------------------------------------------------
      - name: Install Dependencies
        run: uv sync --frozen


      # ------------------------------------------------
      # Tests
      # ------------------------------------------------
      - name: Run Tests
        run: |
          uv run pytest \
            --disable-warnings \
            --maxfail=1 \
            --cov=. \
            --cov-fail-under=100


  # ==================================================
  # Deploy Base Infrastructure
  #
  # Runs only when infra/** changes.
  #
  # IMPORTANT:
  # EcsServiceStack is NOT deployed here because
  # the Docker image for the current commit does not
  # exist in ECR yet.
  # ==================================================
  cdk-deploy:
    name: Deploy Base Infrastructure

    needs:
      - changes
      - test

    if: needs.changes.outputs.cdk == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:

      # ------------------------------------------------
      # Checkout
      # ------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------
      # Python
      # ------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ------------------------------------------------
      # UV
      # ------------------------------------------------
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true


      # ------------------------------------------------
      # Install CDK Python Dependencies
      # ------------------------------------------------
      - name: Install CDK Python Dependencies
        run: |
          uv pip install \
            --system \
            -r requirements.txt


      # ------------------------------------------------
      # Node.js
      #
      # AWS CDK CLI runs using Node.js.
      # ------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"


      # ------------------------------------------------
      # Install AWS CDK CLI
      # ------------------------------------------------
      - name: Install AWS CDK CLI
        run: npm install --global aws-cdk


      # ------------------------------------------------
      # AWS Authentication
      #
      # Currently using GitHub Secrets.
      # Later this should be migrated to GitHub OIDC.
      # ------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------------
      # Verify Environment
      # ------------------------------------------------
      - name: Verify CDK Environment
        run: |
          python --version
          uv --version
          node --version
          npm --version
          cdk --version


      # ------------------------------------------------
      # CDK Synth
      #
      # Validates that CDK code can generate
      # CloudFormation successfully.
      # ------------------------------------------------
      - name: CDK Synth
        run: cdk synth


      # ------------------------------------------------
      # Deploy Base Infrastructure
      #
      # EcsServiceStack intentionally excluded.
      # ------------------------------------------------
      - name: Deploy Base Infrastructure
        run: |
          cdk deploy \
            NetworkStack \
            SecurityStack \
            EcrStack \
            IamStack \
            EcsStack \
            AlbStack \
            --require-approval never


  # ==================================================
  # Build + Deploy Application
  # ==================================================
  build-and-deploy:
    name: Build and Deploy Application

    needs:
      - test
      - cdk-deploy

    # cdk-deploy can be:
    #
    # success  -> infra changed and deployed
    # skipped  -> infra did not change
    #
    # Application deployment should run in both cases.
    if: |
      always() &&
      needs.test.result == 'success' &&
      (
        needs.cdk-deploy.result == 'success' ||
        needs.cdk-deploy.result == 'skipped'
      )

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------
      # Checkout
      # ------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------
      # AWS Authentication
      # ------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------------
      # Login to ECR
      # ------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ------------------------------------------------
      # Docker Buildx
      # ------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------
      # Build Docker Image
      #
      # github.sha makes every image version unique.
      # ------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            .


      # ------------------------------------------------
      # Security Scan
      #
      # Deployment fails if HIGH or CRITICAL
      # vulnerabilities are found.
      # ------------------------------------------------
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln


      # ------------------------------------------------
      # Tag Docker Image
      # ------------------------------------------------
      - name: Tag Docker Image
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}


      # ------------------------------------------------
      # Push Docker Image
      # ------------------------------------------------
      - name: Push Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}


      # ==================================================
      # Setup CDK for Application Deployment
      # ==================================================

      # ------------------------------------------------
      # Python
      # ------------------------------------------------
      - name: Setup Python for CDK
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ------------------------------------------------
      # UV
      # ------------------------------------------------
      - name: Install UV for CDK
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true


      # ------------------------------------------------
      # Install CDK Python Dependencies
      # ------------------------------------------------
      - name: Install CDK Python Dependencies
        working-directory: infra
        run: |
          uv pip install \
            --system \
            -r requirements.txt


      # ------------------------------------------------
      # Node.js
      # ------------------------------------------------
      - name: Setup Node.js for CDK
        uses: actions/setup-node@v4
        with:
          node-version: "24"


      # ------------------------------------------------
      # AWS CDK CLI
      # ------------------------------------------------
      - name: Install AWS CDK CLI
        run: npm install --global aws-cdk


      # ------------------------------------------------
      # Deploy ECS Service
      #
      # Docker image already exists in ECR at this point.
      #
      # CDK now owns:
      #
      # - Task Definition
      # - Container Definition
      # - ECS Service
      # - Rolling Deployment
      # - Circuit Breaker
      # - CPU Auto Scaling
      # - Memory Auto Scaling
      # ------------------------------------------------
      - name: Deploy ECS Service
        working-directory: infra
        run: |
          cdk deploy \
            EcsServiceStack \
            -c imageTag=${{ github.sha }} \
            --require-approval never


      # ------------------------------------------------
      # Wait Until ECS Deployment Stabilizes
      # ------------------------------------------------
      - name: Wait for ECS Deployment
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"


      # ------------------------------------------------
      # Deployment Summary
      # ------------------------------------------------
      - name: Deployment Summary
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query \
              "services[0].{
                Service:serviceName,
                Desired:desiredCount,
                Running:runningCount,
                Pending:pendingCount,
                TaskDefinition:taskDefinition,
                DeploymentStatus:deployments[0].rolloutState
              }"


