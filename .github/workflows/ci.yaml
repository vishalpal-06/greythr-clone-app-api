name: FastAPI CI

on:
  push:
    branches: ["main"]

jobs:
  format-check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Black code formatter check
        uses: psf/black@stable
        with:
          version: "25.11.0" 
          options: "--check"
  
  test:
    runs-on: ubuntu-latest
    needs: format-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests and coverage check
        run: |
          uv run pytest \
            --disable-warnings \
            --maxfail=1 \
            --cov=. \
            --cov-fail-under=100

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: fastapi-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d \
            --name fastapi-app \
            -p 8000:8000 \
            fastapi-app:latest

      - name: Wait for app to start
        run: |
          echo "Waiting for container to become healthy..."
          for i in {1..30}; do
            if curl -sf http://localhost:8000/ > /dev/null; then
              echo "App is up!"
              exit 0
            fi
            echo "Attempt $i/30 – still starting..."
            sleep 2
          done
          echo "App failed to start in time"
          docker logs fastapi-app
          exit 1

      - name: Health check
        run: |
          response=$(curl -s http://localhost:8000/)
          echo "Response: $response"

          echo "$response" | grep -q '"status": "Welcome to My Grehthrapp By Vishal K. Pal"'

          if [ $? -eq 0 ]; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed – unexpected response"
            docker logs fastapi-app
            exit 1
          fi

      - name: Stop container
        if: always()
        run: docker stop fastapi-app || true
  
